<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f0e8">
<title>共同制作ノート</title>
<style>
:root{--paper:#f4f0e8;--paper2:#fffdf8;--ink:#39362f;--muted:#827d72;--line:#ded7ca;--accent:#9a8060;--sage:#899483;--shadow:0 8px 28px #51463312}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;line-height:1.65}
button,input,textarea,select{font:inherit}button{cursor:pointer}
header{position:sticky;top:0;z-index:5;background:#f4f0e8ed;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px 16px}
.head{max-width:900px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-family:Georgia,serif;font-size:19px;letter-spacing:.05em}.sub{font-size:10px;color:var(--muted);letter-spacing:.16em}
main{max-width:900px;margin:auto;padding:20px 15px 100px}.intro{padding:22px 5px 16px}.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--accent)}h1{font-family:Georgia,"Yu Mincho",serif;font-size:27px;font-weight:500;line-height:1.35;margin:6px 0}p{margin:6px 0}.muted{color:var(--muted);font-size:13px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.btn{border:1px solid var(--line);background:var(--paper2);color:var(--ink);border-radius:999px;padding:9px 14px;font-size:13px}.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}.btn.active{background:#e6dfd2;border-color:#c9bda9}.btn.small{padding:6px 11px;font-size:12px}
input,textarea,select{width:100%;border:1px solid var(--line);border-radius:10px;background:#fffdf9;padding:11px;color:var(--ink);outline:none}textarea{min-height:150px;resize:vertical}label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px}.search{margin:14px 0}
.tabs{display:flex;gap:7px;margin:16px 0 18px}.tabs button{flex:1}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.card{background:var(--paper2);border:1px solid #e5ded2;border-radius:13px;overflow:hidden;box-shadow:var(--shadow)}.card-body{padding:13px}.card h3{font-family:"Yu Mincho",serif;font-weight:500;font-size:17px;line-height:1.4;margin:3px 0 5px}.card img{width:100%;height:145px;object-fit:cover;display:block;background:#e9e2d6}.date{font-size:11px;color:var(--muted)}.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}.tag{font-size:10px;color:#716b60;background:#eee9df;border-radius:99px;padding:2px 8px}.excerpt{font-size:12px;color:#696458;margin-top:7px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.empty{border:1px dashed #cfc6b8;border-radius:14px;padding:28px 18px;text-align:center;color:var(--muted);grid-column:1/-1}.empty strong{display:block;color:var(--ink);font-family:Georgia,serif;font-size:18px;margin-bottom:5px}
.panel{background:var(--paper2);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}.form-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.hidden{display:none!important}
.detail{max-width:720px;margin:auto}.detail-title{font-family:"Yu Mincho",serif;font-size:27px;line-height:1.5;font-weight:500}.quote{border-left:3px solid #b9a487;padding:9px 13px;margin:17px 0;background:#f5f0e7;font-family:"Yu Mincho",serif}.article{white-space:pre-wrap;font-family:"Yu Mincho",serif;font-size:15px;line-height:2.05}.original{white-space:pre-wrap;font-size:13px;line-height:1.85;border-top:1px solid var(--line);padding-top:15px;margin-top:20px}
.scrap .detail-content{background:#fffaf0;border:1px solid #e5d9c6;padding:18px;box-shadow:var(--shadow);transform:rotate(-.15deg)}.scrap .detail-title{font-family:"Yu Mincho",serif}.photo-strip{display:flex;gap:9px;overflow-x:auto;margin:14px 0}.photo-strip img{height:125px;width:auto;max-width:75%;border:6px solid white;box-shadow:0 3px 10px #0002;transform:rotate(-1deg)}
.literary .detail-content{background:#fffdf8;padding:22px 20px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.literary .detail-title{font-family:"Yu Mincho",serif;letter-spacing:.04em}.literary .article{max-width:620px;margin:20px auto}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#f8f5eef2;backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:9px max(12px,env(safe-area-inset-right)) calc(9px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:clamp(12px,5vw,48px);z-index:6}.nav{border:0;background:none;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}.nav b{font-size:19px;font-weight:400}.nav.selected{color:var(--ink)}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--paper);color:var(--ink);width:min(94vw,680px);max-height:90vh;padding:0;box-shadow:0 20px 70px #0003}dialog::backdrop{background:#27231dcc}.modal-head{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-body{padding:16px;overflow:auto;max-height:calc(90vh - 60px)}.photo-preview{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.photo-preview img{width:78px;height:78px;object-fit:cover;border-radius:8px}
footer{text-align:center;color:#a19a8e;font:11px Georgia,serif;margin:30px 0 10px}
@media(min-width:650px){main{padding-top:30px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.card img{height:175px}.intro{padding-top:34px}.detail-content{padding:34px!important}}
@media(max-width:380px){.grid{grid-template-columns:1fr}.card img{height:175px}}
</style>
</head>
<body>
<header><div class="head"><div><div class="brand">Dialogue Archive</div><div class="sub">共同制作ノート</div></div><button class="btn small" id="backupTop">バックアップ</button></div></header>
<main id="app">
<section id="homeView">
 <div class="intro"><div class="eyebrow">OUR DIALOGUE, OUR STORY</div><h1>ふたりの対話を、<br>未来の宝物に。</h1><p class="muted">思いついたこと、語り合ったこと。少しずつ、ここに残していこう。</p></div>
 <div class="toolbar"><button class="btn primary" id="newNote">＋ 新しい記録</button><button class="btn" id="importBtn">読み込み</button><button class="btn" id="exportBtn">バックアップを書き出す</button></div>
 <input class="search" id="search" placeholder="タイトル・本文・タグから検索">
 <div class="tabs"><button class="btn active" data-filter="all">すべて</button><button class="btn" data-filter="scrap">スクラップ</button><button class="btn" data-filter="article">記事あり</button></div>
 <div class="grid" id="notesGrid"></div>
 <footer>Made with care · Dialogue Archive v0.1</footer>
</section>
<section id="detailView" class="hidden"></section>
<section id="albumView" class="hidden">
 <div class="intro"><div class="eyebrow">MEMORY ALBUM</div><h1>写真のアルバム</h1><p class="muted">記録に添えた写真を、ここから眺められます。</p></div><div class="grid" id="albumGrid"></div>
</section>
<section id="searchView" class="hidden">
 <div class="intro"><div class="eyebrow">FIND A MEMORY</div><h1>記録を探す</h1><p class="muted">言葉やテーマから、過去の対話へ。</p></div><input id="search2" placeholder="キーワードを入力"><div class="grid" id="searchGrid" style="margin-top:14px"></div>
</section>
</main>
<nav class="bottom"><button class="nav selected" data-page="home"><b>⌂</b>ホーム</button><button class="nav" data-page="home"><b>▤</b>ノート</button><button class="nav" data-page="album"><b>▧</b>アルバム</button><button class="nav" data-page="search"><b>⌕</b>検索</button></nav>
<dialog id="editor"><div class="modal-head"><strong id="editorHeading">新しい記録</strong><button class="btn small" id="closeEditor">閉じる</button></div><div class="modal-body">
 <input type="hidden" id="editId">
 <label>タイトル</label><input id="title" placeholder="例：幸福とは何か">
 <label>日付</label><input id="date" type="date">
 <label>カテゴリ</label><input id="category" placeholder="例：哲学・思想">
 <label>タグ（カンマ区切り）</label><input id="tags" placeholder="幸福, 人生, 対話">
 <label>スクラップブック用の短いまとめ</label><textarea id="summary" placeholder="この日の対話を短くまとめる"></textarea>
 <label>印象に残った言葉（任意）</label><textarea id="quote" style="min-height:75px" placeholder="あとから読み返したい一節"></textarea>
 <label>編集記事・考察（任意）</label><textarea id="article" placeholder="論点や考察を読み物として整理する"></textarea>
 <label>会話全文（原文）</label><textarea id="original" style="min-height:190px" placeholder="ChatGPTとの会話をここに貼り付ける。原文として保存されます。"></textarea>
 <label>写真を追加</label><input id="photos" type="file" accept="image/*" multiple><div class="photo-preview" id="photoPreview"></div>
 <div class="form-actions"><button class="btn primary" id="saveNote">保存する</button><button class="btn" id="cancelEdit">キャンセル</button><button class="btn" id="deleteNote" style="margin-left:auto;color:#9b5148">削除</button></div>
</div></dialog>
<input type="file" id="importFile" accept="application/json" hidden>
<script>
const DB_NAME='dialogue_archive_v01', STORE='notes';
let db, notes=[], currentFilter='all', pendingPhotos=[];
const $=id=>document.getElementById(id);
const today=()=>new Date().toLocaleDateString('sv-SE');
function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>req.result.createObjectStore(STORE,{keyPath:'id'});req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function allNotes(){return new Promise((resolve,reject)=>{const r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>resolve(r.result.sort((a,b)=>(b.date||'').localeCompare(a.date||'')));r.onerror=()=>reject(r.error)})}
function put(n){return new Promise((resolve,reject)=>{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).put(n);t.oncomplete=resolve;t.onerror=()=>reject(t.error)})}
function remove(id){return new Promise((resolve,reject)=>{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).delete(id);t.oncomplete=resolve;t.onerror=()=>reject(t.error)})}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(d){return d?d.replaceAll('-','.'):''}
function show(page){['homeView','detailView','albumView','searchView'].forEach(id=>$(id).classList.add('hidden'));$(({home:'homeView',detail:'detailView',album:'albumView',search:'searchView'})[page]||'homeView').classList.remove('hidden');document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('selected',n.dataset.page===page));}
function card(n){const img=n.photos?.[0];return `<article class="card" data-open="${n.id}">${img?`<img src="${img.data}" alt="">`:'<div style="height:90px;background:linear-gradient(135deg,#e9e1d2,#f8f4eb);display:grid;place-items:center;color:#a79b86;font:italic 14px Georgia">a memory</div>'}<div class="card-body"><div class="date">${fmt(n.date)} · ${esc(n.category||'未分類')}</div><h3>${esc(n.title||'無題')}</h3><div class="excerpt">${esc(n.summary||n.article||n.original||'まだ内容はありません。')}</div><div class="tags">${(n.tags||[]).map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div></div></article>`}
function renderGrid(target,list){$(target).innerHTML=list.length?list.map(card).join(''):'<div class="empty"><strong>まだ記録がありません</strong>最初の対話を、ここに残してみよう。</div>';$(target).querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>openDetail(el.dataset.open))}
async function refresh(){notes=await allNotes();let q=$('search').value.toLowerCase();let list=notes.filter(n=>{let text=[n.title,n.category,n.summary,n.quote,n.article,n.original,(n.tags||[]).join(' ')].join(' ').toLowerCase();return (!q||text.includes(q))&&(currentFilter==='all'||(currentFilter==='scrap'?true:!!n.article))});renderGrid('notesGrid',list);renderAlbum();if(!$('searchView').classList.contains('hidden'))runSearch()}
function renderAlbum(){let items=[];notes.forEach(n=>(n.photos||[]).forEach(p=>items.push({n,p})));$('albumGrid').innerHTML=items.length?items.map(({n,p})=>`<article class="card" data-open="${n.id}"><img src="${p.data}" alt=""><div class="card-body"><div class="date">${fmt(n.date)}</div><h3>${esc(n.title)}</h3><div class="muted">${esc(p.name||'')}</div></div></article>`).join(''):'<div class="empty"><strong>写真はまだありません</strong>ノートに写真を添えると、ここに集まります。</div>';$('albumGrid').querySelectorAll('[data-open]').forEach(e=>e.onclick=()=>openDetail(e.dataset.open))}
function runSearch(){let q=$('search2').value.toLowerCase();renderGrid('searchGrid',notes.filter(n=>[n.title,n.category,n.summary,n.quote,n.article,n.original,(n.tags||[]).join(' ')].join(' ').toLowerCase().includes(q)))}
function openEditor(n){$('editorHeading').textContent=n?'記録を編集':'新しい記録';$('editId').value=n?.id||'';['title','category','summary','quote','article','original'].forEach(k=>$(k).value=n?.[k]||'');$('date').value=n?.date||today();$('tags').value=(n?.tags||[]).join(', ');pendingPhotos=n?.photos?[...n.photos]:[];renderPhotoPreview();$('deleteNote').style.display=n?'inline-block':'none';$('editor').showModal()}
function renderPhotoPreview(){$('photoPreview').innerHTML=pendingPhotos.map((p,i)=>`<div style="position:relative"><img src="${p.data}" alt=""><button type="button" data-remove="${i}" style="position:absolute;right:-5px;top:-5px;border:0;border-radius:50%;background:#39362f;color:white">×</button></div>`).join('');$('photoPreview').querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{pendingPhotos.splice(+b.dataset.remove,1);renderPhotoPreview()})}
$('photos').onchange=async e=>{for(const f of e.target.files){const data=await new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(f)});pendingPhotos.push({name:f.name,data})}renderPhotoPreview();e.target.value=''};
$('newNote').onclick=()=>openEditor();$('closeEditor').onclick=$('cancelEdit').onclick=()=>$('editor').close();
$('saveNote').onclick=async()=>{let id=$('editId').value||crypto.randomUUID();let n={id,title:$('title').value.trim()||'無題',date:$('date').value||today(),category:$('category').value.trim(),tags:$('tags').value.split(',').map(x=>x.trim()).filter(Boolean),summary:$('summary').value,quote:$('quote').value,article:$('article').value,original:$('original').value,photos:pendingPhotos,updatedAt:new Date().toISOString()};await put(n);$('editor').close();await refresh();show('home')};
$('deleteNote').onclick=async()=>{let id=$('editId').value;if(id&&confirm('この記録を削除しますか？')){await remove(id);$('editor').close();await refresh();show('home')}};
async function openDetail(id){let n=notes.find(x=>x.id===id);if(!n)return;show('detail');let d=$('detailView');d.className='detail scrap';d.innerHTML=`<div class="toolbar"><button class="btn" id="backHome">← 一覧へ</button><button class="btn active" id="scrapMode">スクラップ</button><button class="btn" id="literaryMode">文芸誌</button><button class="btn" id="editThis">編集</button></div><div class="detail-content"><div class="eyebrow">${esc(n.category||'DIALOGUE')} · ${fmt(n.date)}</div><h1 class="detail-title">${esc(n.title)}</h1><div class="tags">${(n.tags||[]).map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div>${n.photos?.length?`<div class="photo-strip">${n.photos.map(p=>`<img src="${p.data}" alt="${esc(p.name||'') }">`).join('')}</div>`:''}${n.summary?`<h3>この日のこと</h3><p>${esc(n.summary).replaceAll('\\n','<br>')}</p>`:''}${n.quote?`<div class="quote">「${esc(n.quote)}」</div>`:''}${n.article?`<h3>編集記事</h3><div class="article">${esc(n.article)}</div>`:''}${n.original?`<details><summary>会話全文を読む</summary><div class="original">${esc(n.original)}</div></details>`:''}<p class="muted" style="margin-top:25px">記録を編集して、いつでも育てていけます。</p></div>`;
$('backHome').onclick=()=>{show('home');refresh()};$('editThis').onclick=()=>openEditor(n);$('scrapMode').onclick=()=>{d.classList.add('scrap');d.classList.remove('literary');$('scrapMode').classList.add('active');$('literaryMode').classList.remove('active')};$('literaryMode').onclick=()=>{d.classList.add('literary');d.classList.remove('scrap');$('literaryMode').classList.add('active');$('scrapMode').classList.remove('active')}}
function download(name,data,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([data],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
async function exportData(){let data={format:'DialogueArchive',version:1,exportedAt:new Date().toISOString(),notes:await allNotes()};download('dialogue-archive-backup-'+today()+'.json',JSON.stringify(data), 'application/json')}
$('exportBtn').onclick=$('backupTop').onclick=exportData;
$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.notes))throw Error();if(confirm(`${d.notes.length}件の記録を読み込みます。同じIDの記録は上書きされます。よろしいですか？`)){for(let n of d.notes)await put(n);await refresh();alert('読み込みました')}}catch(err){alert('バックアップファイルを読み込めませんでした')}e.target.value=''};
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{currentFilter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));refresh()});
$('search').oninput=refresh;$('search2').oninput=runSearch;
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{show(b.dataset.page);if(b.dataset.page==='search')runSearch()});
(async()=>{try{db=await openDB();await refresh()}catch(e){alert('このブラウザではローカル保存を利用できません。Safariで開いてください。')}})();
</script>
</body></html>
